name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [c3, esp32dev, s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -U platformio
      - name: Placeholder secrets (real ones are gitignored; the firmware falls back to the setup portal)
        run: cp src/secrets.example.h src/secrets.h
      - run: pio run -e ${{ matrix.env }}
      - name: Image fits its 0x150000 OTA slot
        run: test "$(stat -c%s .pio/build/${{ matrix.env }}/firmware.bin)" -le 1376256

  blocklist-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse hosts, plain and AdGuard-style input
        run: |
          printf '||ads.example.com^\n@@||ok.example.org^\n||ok.example.org^\n0.0.0.0 hosts.example.com\nplain.example.com\n/^regex$/\n' > t.txt
          python3 tools/build_blocklist.py t.bin t.txt
          test "$(stat -c%s t.bin)" -eq 15   # 3 entries x 5 bytes
      - name: Unit tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Wire-format tests
        # src/wire.h is the parsing and matching logic every target shares, with no
        # platform dependencies, so these run here and cover all of them at once.
        # The sanitized build is the one that matters: these bytes come off the
        # network, so the fuzz pass has to prove no overrun and nothing undefined.
        run: |
          c++ -std=c++17 -Wall -Werror -I src -o /tmp/test_wire tools/test_wire.cpp
          /tmp/test_wire
          c++ -std=c++17 -Wall -Werror -g -fsanitize=address,undefined \
              -fno-sanitize-recover=all -I src -o /tmp/test_wire_san tools/test_wire.cpp
          /tmp/test_wire_san
      - name: Dashboard tests
        # The dashboard's live-tracker card keeps state across polls, so a reboot
        # or a long-open tab can break it without changing how a screenshot looks.
        run: node tools/test_page.js
      - name: Tools compile
        # dnsbench.py and dnscheck.py need a live device, so CI can only check
        # that they are not broken on the way in.
        run: python3 -m py_compile tools/*.py
