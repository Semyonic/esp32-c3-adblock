[platformio]
default_envs = s3   ; the deployed box is the S3 (an OTA of a c3 image fails: chip ID mismatch)

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-S3-LCD-1.47 style board: ESP32-S3R8, 16MB quad flash, 8MB octal PSRAM.
; DIO flash mode matches the eFuse (flash_id: quad, mode DIO) so it always boots.
[env:s3]
board = esp32-s3-devkitc-1
upload_protocol = espota
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = dio_opi    ; eFuse: embedded PSRAM 8MB (octal), DIO flash
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.12.1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
